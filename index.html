<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutinas | Gimnasio</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Rutinas de entrenamiento</h1>
      <button class="app__button" id="buttonCreateRutine">Crear Rutina</button>
    </header>

   

      <div id="routinesTable" class="routines-table">
        <p class="empty-state">No hay rutinas. Haz clic en "Crear Rutina" para comenzar.</p>
      </div>

    <dialog class="modal" id="createRoutineModal">

      <h2 class="modal__title">Nueva Rutina</h2>


      <form id="formRoutine" class="form">

        <div class="modal__field">
          <label class="modal__label" for="name">Nombre</label>
          <input class="modal__input" type="text" id="name" name="name" required>
        </div>


        <div class="modal__field">
          <label class="modal__label" for="series">Series</label>
          <input class="modal__input" type="number" id="series" name="series" min="2" max="5" step="1" required>
        </div>


        <div class="modal__field">
          <label class="modal__label" for="repetitions">Repeticiones</label>
          <input class="modal__input" type="number" id="repetitions" name="repetitions" min="5" max="30" step="1" required>
        </div>


        <div class="modal__field">
          <label class="modal__label" for="rest">Descanso</label>
          <input class="modal__input" type="number" id="rest" name="rest" min="30" max="60"  step="1" required>
        </div>


        <div class="modal__actions">
          <button type="button" class="modal__button modal__button--cancel" id="btnCerrar">Cerrar Ventana</button>
          <button type="submit" class="modal__button modal__button--submit" id="createRoutineBtn">Registrar</button>
        </div>

      </form>

      <div id="messageBox" class="message-box hidden"></div>
    </dialog>

    <footer class="app__footer">
      <p>Gimnasio de barrio · Rutinas de entrenamiento</p>
    </footer>
  </main>

  <script src="src/app.js"></script>
</body>

</html>
